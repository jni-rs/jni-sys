[workspace]
resolver = "2"
members = ["systest", "jni-sys-macros", "jni-sys", "jvmti-sys"]

[workspace.package]
version = "0.4.1"
authors = [
    "Steven Fackler <sfackler@gmail.com>",
    "Robert Bragg <robert@sixbynine.org>",
]
license = "MIT OR Apache-2.0"
description = "Rust definitions corresponding to jni.h"
repository = "https://github.com/jni-rs/jni-sys"
readme = "README.md"
categories = ["external-ffi-bindings"]
keywords = ["java", "jni"]
edition = "2021"
rust-version = "1.77.0"
exclude = ["/.github"]

[workspace.dependencies]
jni-sys-macros = { path = "jni-sys-macros" }
jni-sys = { path = "jni-sys" }
jvmti-sys = { path = "jvmti-sys", package = "jvm-ti-sys" }
trybuild = "1"
thiserror = "2"
