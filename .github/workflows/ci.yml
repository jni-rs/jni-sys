name: CI

on: [pull_request, push]

jobs:
  # Check code formatting.
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Run rustfmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  # Static analyzer.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: cargo clippy -p jni-sys --all-targets --all-features -- -D warnings

  # Security audit.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Tests.
  test:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: Linux MSRV
            os: ubuntu-latest
            rust-version: 1.76.0
          - build: Linux
            rust-version: stable
            os: ubuntu-latest
          - build: macOS
            rust-version: stable
            os: macOS-latest
          - build: Windows
            rust-version: stable
            os: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
      - name: Toolchain Info
        run: rustup show active-toolchain
      - name: Install java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: cargo build -p jni-sys
      - name: Test
        run: cargo test -p jni-sys

      # Note: we don't currently run systest via CI
